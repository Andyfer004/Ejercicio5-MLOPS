# Ambiente de conda para el Taller 3 (MLflow).
#   conda env create -f environment.yml
#   conda activate taller3-mlops
name: taller3-mlops
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - scikit-learn>=1.5
  - pandas>=2.2
  - numpy>=1.26
  - scipy>=1.12
  - joblib>=1.3
  - matplotlib>=3.8
  - jupyter
  - nbclient
  - pip
  - pip:
      # MLflow 3 desde PyPI (trae la interfaz web y el servidor de seguimiento)
      - mlflow==3.17.1
      - skops>=0.13,<1
      # El paquete del taller en modo editable: crea los comandos taller3-*
      - -e .
