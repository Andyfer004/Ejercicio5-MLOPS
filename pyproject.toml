[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taller3-pipeline"
version = "0.1.0"
description = "Pipeline de scikit-learn con seguimiento de experimentos y registro de modelos en MLflow (Taller 3 - MLE/MLOps, UVG)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Diego Linares", email = "lin221256@uvg.edu.gt" },
    { name = "Andy Fuentes" },
    { name = "Christian Echeverria" },
    { name = "Diederich Solís" },
]
keywords = ["scikit-learn", "pipeline", "mlflow", "experiment-tracking", "mlops"]
dependencies = [
    "mlflow==3.17.1",
    "skops>=0.13,<1",
    "scikit-learn>=1.5,<1.9",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "joblib>=1.3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["jupyterlab", "nbclient", "ipykernel"]
dev = ["pytest", "build"]

[project.urls]
Repository = "https://github.com/Andyfer004/Ejercicio5-MLOPS"
"Original (créditos)" = "https://github.com/DiegoLinares11/MLFlow"

# Comandos que crea el instalador (entry points console_scripts)
[project.scripts]
taller3-entrenar = "taller3_pipeline.cli:main_entrenar"
taller3-demo = "taller3_pipeline.cli:main_demo"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"taller3_pipeline" = ["datasets/*.csv"]
